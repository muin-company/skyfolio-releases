name: 기능 요청 · Feature request
description: 있었으면 하는 것 · Something you wish the app did
title: "[요청] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 필요한가요? · When do you need it?
      description: 지금은 어떻게 하고 있고 무엇이 불편한지 · What you do today and what is awkward about it
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 어떻게 되면 좋을까요? · What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 어느 부분인가요? · Which part?
      multiple: true
      options:
        - 갤러리 · Gallery
        - 관측일지 · Journal
        - 성도 · Sky chart
        - 도감 · Catalog
        - 사진 들여오기·처리(데스크톱) · Import and processing (desktop)
        - 동기화 · Sync
        - 언어·테마 · Language and theme
        - 그 밖 · Other
  - type: input
    id: gear
    attributes:
      label: 사용하는 장비 · Your gear
      placeholder: "Seestar S50 Pro, Vespera, ASIAIR + …"
